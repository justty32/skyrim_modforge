# ModForge 規格說明 — 創作參考手冊（Part 1/3）

**spec** 是一個 JSON 檔案，描述一個 Skyrim 外掛的內容。它是意圖（自然語言，由 AI 代理轉換為規格）與確定性生成器（Mutagen）之間的契約。你撰寫或產生一個 spec，對其執行 `validate`，然後執行 `build` 或 `package`。

```
NL / idea ──(AI agent: Claude Code)──▶ spec.json ──(validate)──▶ ──(build | package)──▶ .esp [+ .pex]
```

屬性名稱**不區分大小寫**（`editorId` == `EditorId`）；範例使用 camelCase。

## 交叉參照與 ID

- 每筆記錄都有一個 **`editorId`** — 你自行選擇的穩定且唯一的名稱。這是記錄在 *spec 內部*相互參照的方式（一個 npc 透過其 `editorId` 加入陣營；一個對話透過 `editorId` 指名其任務）。它**不是** FormID：Mutagen 會自動指派 FormID 與 master。
- `editorId` 必須在整個 spec 中**非空且唯一**（`validate` 會強制執行）。
- `esl: true`（預設值）將外掛標記為輕量 master — 新記錄的 FormID 必須符合 **0x800–0xFFF，即總計 ≤ 2048** 筆。超過此限制在寫入時會產生嚴重錯誤（附帶明確訊息）；若需要更多記錄，請設定 `esl: false` 或將內容分散到多個外掛中。

### 參照 vanilla / 外部 form
某些欄位為 **refs**：它們接受 *spec 內部的* `editorId` *或*另一個外掛中的外部 form，寫作 **`"<master>:0xFORMID"`**（例如 `"Skyrim.esm:0x013746"` = `NordRace`）。外部 refs 讓你的內容可以指向 vanilla 的種族、職業、裝束、關鍵字、陣營等。指定的 master 在建置時會**自動加入外掛**。

- **使用 `find` 指令查找 FormID：**
  `find "<Skyrim Data>/Skyrim.esm" <query> [type]` → 印出 `Skyrim.esm:0xFORMID  Type  EditorID`。
  `[type]`（例如 `Race`、`Class`、`Outfit`、`Keyword`、`Faction`、`Weapon`、`Npc`）可將搜尋範圍縮小至單一記錄類型。（搜尋與顯示以 **EditorID** 為準；本地化顯示*名稱*打包在 BSA 中，無頭模式下無法解析 — 像 `NordRace` 這樣的 EditorID 已足夠描述性。）
- `validate` 會檢查 ref 欄位：spec 內部的 ref 必須存在；外部 ref 必須格式正確。

## 頂層結構

```jsonc
{
  "pluginName": "MyMod.esp",   // 輸出檔名 / ModKey
  "esl": true,                  // 輕量 master 旗標（預設 true）；≤2048 筆新記錄

  "miscItems": [...], "books": [...], "weapons": [...], "npcs": [...],
  "quests": [...], "dialogue": [...], "banter": [...], "spells": [...], "potions": [...],
  "armors": [...], "factions": [...], "messages": [...],
  "scripts": [...],             // Papyrus 附加（見下方）
  "cells": [...], "placements": [...],  // 新室內 cell + 在其中放置 form
  "leveledItems": [...], "leveledNpcs": [...], "containers": [...],
  "ingredients": [...], "ammunitions": [...], "scrolls": [...], "soulGems": [...],
  "keys": [...], "keywords": [...], "outfits": [...], "statics": [...], "activators": [...],
  "textureSets": [...],          // TXST — 在不使用新 .nif 的情況下重新貼圖現有網格
  "furniture": [...], "sounds": [...],  // 自訂網格家具 + 音效描述符（外部資產）
  "assets": "path/to/asset/dir",        // 來源目錄，其 Meshes/Textures/Sounds 由 `package` 打包
  "packages": [...],             // AI Packages — NPC 的行為（沙盒/移動/使用家具）
  "weathers": [...], "climates": [...],  // 自訂天空（WTHR）+ 天氣循環（CLMT）
  "encounterZones": [...]        // ECZN — 某區域的等級縮放/重生
}
```

## 記錄類型

| 區段 | 欄位 |
|---------|--------|
| `miscItems` | `editorId`、`name`、`value`（int≥0）、`weight`（數字）、`keywords`（*refs* 陣列）、`template`（vanilla MISC ref，用於複製模型）、`model`（自訂 `.nif` 路徑 — 覆蓋 `template` 的網格）、`pickUpSound`/`putDownSound`（SNDR *refs*） |
| `books` | `editorId`、`name`、`text`（書本內文）、`template`（*ref* → vanilla BOOK，用於複製模型 — 可拾取/閱讀的書**必須有此項，否則在 3D 閱讀時會 CRASH**）、`value`（int）、`weight`（數字）、`flags`（`Book.Flag` 名稱陣列）、`teaches`（可選） |
| `books[].teaches` | `{ "kind": "spell", "spell": <ref> }` — 法術書，首次閱讀時授予 SPEL；或 `{ "kind": "skill", "skill": <name> }` — 技能書；或省略 ⇒ 普通書。教學書必須有 `template`。 |
| `weapons` | `editorId`、`name`、`value`、`weight`、`damage`（int≥0）、`speed`（數字）、`reach`（數字）、`keywords`（*refs* 陣列）、`enchantment`（*ref* → ENCH）、`enchantmentAmount`（int）、`template`（vanilla WEAP ref — 複製模型/動畫/裝備；需要此項以避免裝備時 CRASH）、`model`（自訂世界網格 `.nif` 路徑）、`pickUpSound`/`putDownSound`（SNDR *refs*） |
| `npcs` | `editorId`、`name`、`factions`（*refs* 陣列）、`race`（*ref*）、`class`（*ref*）、`outfit`（*ref* → DefaultOutfit）、`level`（int）、`autoCalcStats`（bool）、`packages`（*refs* → PACK 陣列）、`voiceType`（*ref* → VTYP）、`crimeFaction`（*ref* → FACT；城市市民身份，跨 cell 移動所需）、`unique`（bool）、`combatStyle`（*ref* → CSTY）、`spells`（*refs* → SPEL 陣列）、`perks`（*refs* → PERK 陣列）、`greeting`（字串 — Hello 台詞） |

| `outfits` | `editorId`、`items`（*refs* → 盔甲/武器陣列） |

| `packages` | `editorId`、`template`（*ref* → vanilla 程序模板）、`flags`（陣列）、`interruptFlags`（陣列）、`preferredSpeed`（`Walk`\|`Jog`\|`Run`\|`FastWalk`）、`schedule`、`sandbox`/`sleep`/`travel`/`useMagic`/`patrol`/`follow`/`escort`（模板輸入子物件）、`conditions` |

標記為 *ref* 的欄位接受 spec 內部的 `editorId` **或** `"<master>:0xFORMID"`。一個站立的 NPC 至少需要 `race` + `class` 才能在遊戲中表現為真實角色；`outfit` 為其提供服裝/裝備。

### 遊戲數值
- **武器：** 提供 `damage`（通常也提供 `value`/`weight`）。設定任何數值時，`speed` 和 `reach` 預設為 `1.0`，使武器可揮舞；可覆蓋以製作更慢/更快或更長/更短的武器。
- **盔甲：** `armorType` 為 `light` / `heavy` / `clothing`（預設 `clothing`）；`slots` 以 `BipedObjectFlag` 名稱列出其佔用的雙足槽位。

### effects（法術與藥水）
法術或藥水**沒有至少一個 effect 將不起作用**。每個 effect 為：
```jsonc
{ "magicEffect": "Skyrim.esm:0x03EB15",  // a MagicEffect *ref* (usually vanilla)
  "magnitude": 25, "area": 0, "duration": 0 }   // duration in seconds; 0 = instant
```
`magicEffect` 為 *ref* — 一個 vanilla 的（`find <Skyrim.esm> <query> MagicEffect`，例如 `AlchRestoreHealth = Skyrim.esm:0x03EB15`、`AlchDamageHealth = Skyrim.esm:0x03EB42`）**或** spec 內部 `magicEffects` 條目的 `editorId`。一個藥水有一個 effect 即可完全運作；法術還需要施法/法術類型調整，但 effect 是核心。

### magicEffects（自訂 MGEF）
```jsonc
{ "editorId": "MF_RestoreHealthEffect", "name": "ModForge Restore Health",
  "archetype": "ValueModifier",   // ValueModifier | SummonCreature | Bound | Light | Paralysis | …
  "actorValue": "Health",          // Health | Magicka | Stamina | …
  "magicSkill": "Restoration",     // Alteration|Conjuration|Destruction|Illusion|Restoration
  "resistValue": "ResistFire",     // ResistFire | ResistFrost | PoisonResist | …
  "castType": "FireAndForget",     // FireAndForget | Concentration | ConstantEffect
  "targetType": "Self",            // Self | Touch | Aimed | TargetActor | TargetLocation
  "baseCost": 8.0,
  "flags": ["Recover"],            // Hostile | Detrimental | Recover | NoArea | NoDuration | NoMagnitude | …
  "association": "<ref>",          // ARTO/召喚或束縛形體（僅用於 Summon/Bound 原型）
  "projectile": "<ref>",           // PROJ — 飛行的彈體（Aimed 法術需要）
  "castingArt": "<ref>",           // ARTO — 施法者手上的特效
  "hitEffectArt": "<ref>",         // ARTO — 命中點的特效
  "explosion": "<ref>" }           // EXPL — 命中時的 AoE 爆炸
```

**旗標很重要 — 必須配合 effect 的時序（這是第一大陷阱）：**
- **瞬間**恢復/傷害（`duration` 為 0）→ `["NoDuration", "NoArea"]`，傷害時加上 `"Detrimental"`（+`"Hostile"`）。**不要**設定 `Recover` — `Recover` 在 effect *結束*時還原數值，而瞬間 effect 立即結束，因此變更會被撤銷（治療套用 +N 後立即移除 → **淨零，看起來像「施法但什麼都沒做」**）。
- **計時**強化（`duration` > 0）→ `["Recover", "NoArea"]`：`Recover` 在計時器到期時乾淨地移除加成。

保持 `baseCost` 低（vanilla 恢復/傷害 effect 使用約 0.5–3）；法術的魔力消耗由 `baseCost` × `magnitude` 自動計算，因此大的 `baseCost` 會使法術極其昂貴。使用 `mgefdiag <Skyrim.esm> <0xFORMID>` 將任何 effect 與 vanilla 進行比較。

### enchantments（ENCH / 物品效果）

| `enchantType` | EnchantType | 預設 castType / targetType | 充能 | 用途 |
|---|---|---|---|---|
| `weapon`  | `Enchantment` | `FireAndForget` / `Touch` | 武器攜帶充能池（`enchantmentAmount`） | 攻擊時觸發（冰霜/火焰/吸取武器） |
| `apparel` | `Enchantment` | `ConstantEffect` / `Self` | 無 — 穿戴時始終啟用 | 強化/抗性/恢復盔甲 |
| `staff`   | `StaffEnchantment` | `FireAndForget` / `Aimed` | 法杖攜帶充能池 | 法杖「使用時施放」 |

```jsonc
"enchantments": [
  { "editorId": "MF_FrostWeaponEnch", "name": "Frost Damage",
    "enchantType": "weapon",
    "enchantmentCost": 15,
    "effects": [ { "magicEffect": "MF_FrostDamageEnchEffect", "magnitude": 10 } ] }
],
"weapons": [
  { "editorId": "MF_FrostIronSword", "name": "Frostbite Iron Sword",
    "template": "Skyrim.esm:0x012EB7",
    "damage": 8,
    "enchantment": "MF_FrostWeaponEnch",
    "enchantmentAmount": 1500 }
]
```
`apparel`（常效型）附魔以相同方式套用到**盔甲**上（無 `enchantmentAmount` — 裝備為被動）。使用 `enchdiag <in.esp> <0xFORMID>` 檢查已建置或 vanilla 的 ENCH。*（結構已驗證；附魔在遊戲中實際觸發尚未確認 — 見食譜備注。）*

### classes（CLAS）
```jsonc
{ "editorId": "MF_Battlemage", "name": "ModForge Battlemage",
  "teaches": "Destruction",
  "maxTrainingLevel": 50,
  "healthWeight": 30, "magickaWeight": 50, "staminaWeight": 20,
  "skillWeights": { "Destruction": 100, "Restoration": 75, "OneHanded": 50 } }
```

技能名稱：`OneHanded`、`TwoHanded`、`Archery`、`Block`、`Smithing`、`HeavyArmor`、`LightArmor`、`Pickpocket`、`Lockpicking`、`Sneak`、`Alchemy`、`Speech`、`Alteration`、`Conjuration`、`Destruction`、`Illusion`、`Restoration`、`Enchanting`。職業只有在 npc 具有 **`level` > 0 且 `autoCalcStats: true`** 時才會驅動 NPC 的實際屬性/技能值。

### dialogue（對話）

從一個 `dialogue` 條目，建置時會發出**完整的 vanilla 鏈**（已確認 It.23，SSE 1.6.1170）：
- **Topic**（`Custom`，`SNAM='CUST'` — null 子類型在載入時 crash）+ **Branch**（`TopLevel`，Player）+ 攜帶回應的 **INFO**。每個 INFO 獲得 `ENAM`（旗標）+ `CNAM`（好感等級）— **沒有 `ENAM` 的 INFO 被視為無效，其話題會從選單中靜默捨棄**；
- 每個任務對應一個 **DialogView（DLVW）**，將其分支綁定到任務；
- 每個說話 NPC 對應一個 **Hello** info（`Misc`/`Hello`/`SNAM='HELO'`），使 NPC 完全*可對話* — 使用 `npc.greeting` 設定台詞。

> **三個執行時需求（非記錄錯誤）：**（1）對話僅在**遊戲載入**時註冊 — 在主選單使用 `coc` 或在會話中使用 `startquest` 會使 NPC 保持沉默。（2）將說話者放置在真實的房間座標上 — 位於 cell 原點 **(0,0,0)** 會落在導航網格外。（3）無語音台詞閃過；安裝 **Fuz Ro D-oh**（或打包無聲的 `.fuz`）並啟用字幕。見 [常見陷阱](gotchas.html)。

### banter — 主動（未受提示）的 NPC 台詞
共用相同（說話者、任務）的所有 banter 條目會折疊為**一個環境話題**——Category=Misc，SNAM=`IDLE`，無分支——每個條目對應一個標記為 **Random** 的 INFO；引擎隨機挑選一個當前 `conditions` 通過的 INFO 並播放。**觸發需求：** 說話者必須啟用閒聊——具有 `AllowIdleChatter` 中斷旗標的 AI 套件。

### scenes — 兩個 NPC 互相交談（SCEN）
一個 `scene` 是 NPC 之間（非玩家）的腳本對話——vanilla 的 **Scene** 記錄。場景由**任務宿主**，其參與者是該任務的**別名**，並按順序播放**階段**清單，每個階段說一句話。

```jsonc
{ "editorId": "MF_TavernArgument",
  "questEditorId": "MF_SceneQuest",
  "beginOnQuestStart": true,
  "actors": [
    { "aliasId": 0, "npc": "MF_Borin", "name": "Borin" },
    { "aliasId": 1, "npc": "MF_Hilda", "name": "Hilda" } ],
  "phases": [
    { "speaker": 0, "emotion": "Anger",   "lines": [ "You still owe me for the ale, Hilda." ] },
    { "speaker": 1, "emotion": "Disgust", "lines": [ "Owe you? That swill wasn't worth a clipped septim." ] },
    { "speaker": 0, "emotion": "Anger",   "lines": [ "Watch your tongue, or there'll be trouble." ] },
    { "speaker": 1, "emotion": "Happy",   "lines": [ "Ha! Buy me a drink and we're even." ] } ] }
```

> **執行時需求：**（1）兩個 NPC 必須**放置在彼此附近** — 在**同一個 cell** 中。（2）場景只在**遊戲載入**時載入。（3）安裝 **Fuz Ro D-oh**。**狀態：僅限結構**——尚未在遊戲中確認。

### conditions — CTDA 閘門（在 `dialogue` INFO、`banter` INFO 或 `package` 上）
```jsonc
{ "function": "GetItemCount",          // form-arg: HasPerk | GetInFaction | GetItemCount | GetGlobalValue | GetStage | GetIsID | GetRelationshipRank
  //                                    // actorValue-arg: GetActorValue | GetActorValuePercent (0..1)
  //                                    // no-arg: GetCurrentTime (hour 0..24) | IsInInterior | IsInCombat | GetRandomPercent (0..99) | TemperIsEnchanted
  "comparison": ">=",
  "value": 500,
  "param": "Skyrim.esm:0x00000F",      // the function's form arg as a ref
  "actorValue": "",                    // for GetActorValue/GetActorValuePercent
  "runOn": "Reference",                // Subject (default) | Reference | Target | CombatTarget | ...
  "reference": "Skyrim.esm:0x000014",  // the ref read when runOn=Reference (here, the player)
  "or": false }                        // OR with the NEXT condition (default AND)
```
