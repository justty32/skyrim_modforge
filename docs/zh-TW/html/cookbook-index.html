# 食譜手冊 — 目錄

複製貼上的起點範例。與 [TL;DR NPC 食譜](lifelike.html#tldr--the-complete-npc-recipe) 搭配使用，並將每個 `<...>` / FormID 對應至 [formid-reference](formid-ref.html)。

← 返回 [lifelike 主頁](lifelike.html)

| 檔案 | 內容 |
|------|------|
| [cookbook-npc-basics](cookbook-npc-basics.html) | 酒館常客、跨城通勤者、戰鬥法師、自我防衛者、儀式施法者、跟隨同伴 |
| [cookbook-followers](cookbook-followers.html) | 可招募的跟隨者（三條路線：免費/SetFollower/自行管理）、閒暇行為、Sleep 作息、情境台詞、主動閒聊 |
| [cookbook-world-items](cookbook-world-items.html) | 可用的室內空間、填充地城（等級縮放）、可製作物品（COBJ）、無需新網格的重新貼圖（TXST）、可製作與鍛造武器 |
| [cookbook-magic](cookbook-magic.html) | 自訂瞄準戰鬥法術（MGEF+彈體+SPEL）、附魔武器（MGEF+ENCH+WEAP+COBJ）、法術書（BOOK 教授） |
| [cookbook-social-quest](cookbook-social-quest.html) | 可對話的 NPC（遊戲內已確認 It.23）、運作中的商人（遊戲內已確認 2026-05-31）、NPC 被動特技、多階段任務（遊戲內已確認 It.36） |
| [cookbook-advanced](cookbook-advanced.html) | 自訂龍吼（遊戲內已確認 2026-06-01）、自訂天空（WTHR+CLMT）、室外世界空間+地區（僅限記錄層）、兩個 NPC 爭論（SCEN，僅限結構） |
