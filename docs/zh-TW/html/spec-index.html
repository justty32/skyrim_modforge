# ModForge 規格說明 — 目錄

規格（spec）是一個 JSON 檔案 → `.esp` 插件。選擇主題：

| 檔案 | 內容 |
|------|------|
| [SPEC-intro](spec-intro.html) | 交叉參照與 ID、頂層結構、完整記錄類型表 |
| [SPEC-magic](spec-magic.html) | 遊戲數值、法術/藥水 effect、自訂 MGEF、附魔（ENCH） |
| [SPEC-dialogue-quests](spec-dialogue-quests.html) | 職業、對話、閒聊、場景、CTDA 條件、任務階段、Papyrus 腳本 |
| [SPEC-world](spec-world.html) | Cells 與放置、世界空間與地區、等級列表、遭遇區域、商販 |
| [SPEC-items](spec-items.html) | 配方（COBJ）、特技、外部資源（網格/音效）、材質集（TXST） |
| [SPEC-packages](spec-packages.html) | AI 套件（Sandbox/Travel/UseMagic/Follow/Sleep/Patrol/Escort）、天氣與氣候 |
| [SPEC-workflow](spec-workflow.html) | CLI 工作流程（`validate` / `build` / `package`）+ 尚未涵蓋的功能 |

快速 CLI 參考：
```bash
dotnet run --project src/ModForge.Cli -- validate myspec.json
dotnet run --project src/ModForge.Cli -- build    myspec.json out.esp
dotnet run --project src/ModForge.Cli -- package  myspec.json OutModDir
```

另請參見：[lifelike 主頁](lifelike.html) — NPC 食譜、Cookbook、常見陷阱、FormID 參考。
