# 常見陷阱 — 我們踩過的坑，以及解法

依領域分組。每一列為「症狀 → 根本原因 → 修正方式」。這些都是真正耗費過除錯時間的失敗模式；修正欄位是已驗證的解決方法。

← 返回 [lifelike 主頁](lifelike.html) · 另見 [engine-internals](engine-internals.html) 了解「原因」

## NPC 行為（套件、戰鬥、對話）

| 症狀 | 根本原因 | 修正方式 |
|---|---|---|
| 產生的套件其 `target` 讀取為 `LocationTarget` 而非 `LocationFallback`，即便使用了 `new LocationFallback()` | Mutagen 從 `LocationFallback.Type` 列舉取得二進位結構，而非 C# 類別 | `new LocationFallback { Type = LocationTargetRadius.LocationType.NearSelf }` |
| 裝備 Sandbox 的 NPC 無限期站立不動 | 使用了 `Type = NearEditorLocation`——需要 CK 設定的 Editor Location，而 Mutagen 產生的 NPC 缺乏此設定 | 使用 `Type = NearSelf`——錨定於目前位置，無需外部連結 |
| NPC 不移動，只在生成點站立（等待約 1 分鐘後仍無反應） | Sandbox 在附近找不到家具 / idle 標記 / 其他 NPC——區域過於空曠 | 將生成點移至有內容的場景（Bannered Mare、Sleeping Giant Inn）。Sandbox **需要**可互動的內容 |
| Sandbox NPC 在場景載入後的前 30–90 秒靜止不動 | 引擎 Sandbox 冷啟動延遲；屬正常現象 | **等待整整一分鐘**再判定失敗——原版 NPC 因玩家抵達前早已初始化而掩蓋了這個現象 |
| 規格中有 Travel 套件但 NPC 忽略它（改在原地 Sandbox） | 引擎靜默拒絕跨場景 Travel——NPC 沒有「市民」身份無法穿越城門 | 設定 `crimeFaction` + 將城鎮派系加入 `factions` + `unique: true` |
| NPC 會走動但從不說話；靠近時只會喃喃唸「嗯/啊」 | 未設定 voiceType，或已設定聲音但無符合派系條件的對話主題 | 設定 `voiceType: MaleNord`（或類似值）。若要更多對話，加入城鎮派系讓派系條件對話主題生效 |
| 法師 NPC 遇到任何威脅就逃跑 | `Aggression=Unaggressive + Confidence=Cowardly`（Mutagen 預設值）——無論 CombatStyle 為何都會逃跑 | `aggression: "Aggressive"` + `confidence: "Brave"` |
| 城鎮居民將玩家視為敵對 / 主動挑釁 | `aggression: "Aggressive"` 會使 NPC *主動發起*攻擊 | 若要「只防禦不主動攻擊」的 NPC，使用 `aggression: "Unaggressive"` + `confidence: "Brave"`——aggression 決定是否主動發起，Brave 決定受攻擊後是逃跑還是迎戰 |
| UseMagic NPC 站在位置上但**從不施法** | 欄位 3「Spell」以 `PackageTargetObjectType`（分類列舉）撰寫。全部 46 個原版 UseMagic 套件使用 `PackageTargetObjectID` 並以 FormLink 連結至特定 SPEL | 規格欄位 `useMagic.spell: "<master>:0xFORMID"` 指向 SPEL；Build 寫入 `PackageTargetObjectID` |
| UseMagic NPC 施法 1–2 次後永久停止 | `numToCastMax` 是**套件整個生命週期的總施法次數**，而非每輪次數。當 `schedule.durationInMinutes=0` 時，套件在達到配額的瞬間即完成 | `numToCastMax: 1000` + `schedule.durationInMinutes: 1440`（24 小時持續），模仿原版 `WCollegeOnmundPracticeFlames12x4` |
| UseMagic NPC 在戰鬥開始時停止施法 | 戰鬥 AI 搶佔閒置套件（原版行為） | 若施法必須持續（例如 Boss 儀式），加入 `flags: [ "IgnoreCombat" ]`，如同原版 `SprigganCallOverride` |
| 排程套件（夜間睡眠、用餐時段 Sandbox）從不執行，或在錯誤時段執行錯誤套件 | NPC 的 `packages` 清單按**順序 = 優先級**評估：引擎執行**第一個**其排程窗口**且**條件目前皆通過的套件。放置在排程套件**上方**的無條件套件（`schedule.hour = -1` ⇒「任何時段」）在每個小時都會獲勝，因此其下方的排程套件永遠輪不到 | 依**從具體到一般**排序：排程 / 有條件套件**在前**，無條件後備**在後**。排程窗口為 `[hour, hour + durationInMinutes)`；`hour = -1` = 無時段限制。例：`[ "MF_NightSleep" (h=22 dur=540), "MF_Sandbox" (無條件) ]`——22:00–07:00 睡眠，其餘時間 Sandbox |
| Sleep 套件（範本 `0x019717`）NPC 鎖住她入住的旅館 / 共用建築 | `sleep.lockDoors` 預設為 **true**（原版行為：NPC 夜晚鎖自己的*房子*） | 對任何在共用或公共空間（旅館、兵營）就寢的跟隨者 / NPC，設定 `sleep.lockDoors: false` |
| 產生的戰鬥法術從不被施放（NPC 改用近戰） | SPEL 沒有 `equipType`——NPC 無法將無法裝備的法術裝備到手上 | 設定 `spells[].equipType: "Skyrim.esm:0x013F44"`（EitherHand） |
| 巡邏 NPC（或任何路徑前往標記的行為）靜止不動，從不移動 | **靜態 REFR 不會像 Actor 一樣貼齊地板**——在猜測的外部 z 座標放置的標記會落在導航網格之外，因此路徑尋找靜默失敗 | 將標記錨定在**已確認可行走**的座標上：用 `refpos <plugin> <0xFORMID>` 複製可到達的原版 Ref 位置，或放置在手工導航網格化的室內。Actor（ACHR）會貼齊地面；標記（REFR）不會 |
| 當插件包含程式建立的 **NAVM + NAVI**（已廢棄的 `autoNavmesh`）時，**主選單 / 載入時崩潰**——**2026-06-01 已從 CrashLoggerSSE 日誌找出根本原因** | `InitTESThread` 中發生存取違規 → Engine Fixes 的 `PrecomputedPaths::NavMeshInfoMap_InitItemImpl` 走訪我們的 NAVI `[0x0A000804]`：它讀取每個 `NavMeshInfo` 的 **`pathingCell`** 指標（`mov edx,[rcx+0x10]`，rcx=0 → null 解參考）。非 CK 產生的導航網格**沒有 PathingCell / 偏好路徑圖**——該結構由 CK 的 **「Finalize Navmesh」**步驟產生，而非以可撰寫的插件位元組儲存。不完整的 NAVI **比完全沒有更糟**：沒有導航網格的場景仍能載入（NPC 只是站著/sandbox、無法尋路——見前述門/商人範例）；有未完成 NAVI 的場景**在載入時 CTD** | **切勿從產生器輸出 NAVM/NAVI。** `autoNavmesh` 已確認為死路，從未合併進 master。需要真實路徑規劃的新場景必須在 Creation Kit 中建立導航網格並執行 **Finalize Navmesh**。若只需要 NPC 站立/待機，出貨的場景不帶導航網格 + 一個 Sandbox 套件即可 |
| 想要可僱用的跟隨者，但「跟隨我」主題從未出現（**遊戲內已確認 It.24，2026-05-30**） | 原版免費跟隨僱用主題（`DialogueFavorGenericFollowBranchTopic`）受一系列條件限制，探查得知：`GetIsVoiceType` ∈ **VoicesFollowerNeutral（`0x0D23AC`）**、`GetInFaction PotentialFollowerFaction (0x05C84D)==1`、`GetRelationshipRank player >= 1`、`GetInFaction CurrentFollowerFaction(0x05C84E)==0`、`GetInFaction PotentialHireling(0x0BCC9A)==0`、玩家跟隨者計數全域==0。此外 NPC 必須**可對話**（有 Hello——自訂 NPC 光靠跟隨者主題本身無法交談）。坑住我們的有兩個：**(a) 聲音是 FemaleNord/MaleNord——市民聲音，不在跟隨者清單裡**，因此 GetIsVoiceType 失敗（這是最後一道阻礙；修好後 `setrelationshiprank player 3` 即可在遊戲內成功僱用）；**(b) 對玩家的靜態 `relationships[]` RELA 在執行期讀取為 rank 0——它沒有作用。原版有 642 筆 RELA 記錄，沒有任何一筆參照玩家（0x14）：玩家關係永遠由腳本在執行期設定（`SetRelationshipRank`），絕非靜態 RELA。** 因此免費跟隨的自訂跟隨者需要 Papyrus 腳本（`seraRef.SetRelationshipRank(Game.GetPlayer(), 3)`），或走**付費傭兵**路徑（將 `PotentialHireling 0x0BCC9A` 加入 `factions`——該僱用主題的條件是派系成員資格而非關係，因此可從靜態記錄運作）。**已實作（It.26）：** 範例 `examples/follower_hireable_spec.json` 現在以 `Skyrim.esm:0x0BCC9A` 列於 `factions` 作為主要招募路徑——不需修改產生器，因為派系 ref 已通用解析為 `<master>:0xFORMID` 並以 rank 0 加入（原版傭兵慣例）；要取得遊戲內可招募的跟隨者，已不再需要僅腳本的免費跟隨路徑。**⚠ It.27（2026-05-31）已反證，見下一列——僅有 PotentialHireling 成員資格無法招募自訂 NPC。** | 使用**跟隨者聲音**：女性 `FemaleEvenToned 0x013ADD` / `FemaleSultry 0x013AE0` / `FemaleCondescending 0x013AE4` / `FemaleYoungEager 0x013ADC`；男性 `MaleEvenToned 0x013AD2` / `MaleYoungEager 0x013AD1` / `MaleEvenTonedAccented 0x0EA267`。將 `0x05C84D` 加入 `factions`，加一個對 `0x000014` 的 `relationships[]` Ally，並設定 `greeting`（Build 會發出宿主任務 + Hello 使她可對話）。若 RELA 在遊戲內仍讀取為 0，對她執行 `setrelationshiprank player 3` 即可確認其餘部分有效 |
| 付費傭兵招募主題在金幣 <500 時出現，但在金幣 ≥500 時**消失**（**遊戲內 It.26，透過新的 `infodiag` 於 It.27 找出根本原因**） | `HirelingQuestTopic1`（`0x0BCC84`）提供**第一個**其 CTDA 堆疊通過的 INFO。用 `infodiag Skyrim.esm 0x0BCC84` 探查：INFO[0]（「帶錢回來」的**拒絕**）只需要 `CurrentHireling(0x0BD738)==0 & PotentialHireling(0x0BCC9A)==1 & GetItemCount Gold < threshold` → 任何貧窮的 PotentialHireling 成員都通過。但每個**招募** INFO（金幣 ≥ 全域 `0x0F11B5`，執行扣除 500 金幣 + 加入 CurrentHireling 的結果腳本）**也**帶有 `GetIsID == <特定原版 HirelingX>`——HirelingMarcurio `0x0B9980`、HirelingVorstag `0x0B997F`、HirelingErikTheSlayer `0x065657`……**沒有**通用的僅派系招募 INFO；原版為每個傭兵寫死一個。因此自訂 NPC：貧窮 → 拒絕 INFO 通過（主題顯示）；富有 → 拒絕 INFO 失敗（金幣未 <threshold）且每個招募 INFO 都因 `GetIsID(≠custom)` 失敗 → **主題完全消失**。It.26 的假設（GetRelationshipRank 讀取為 0）是**錯的**——判別條件是 **GetIsID**，而非關係。**結論：付費路徑無法從靜態記錄招募任意自訂 NPC；兩種方式都無可避免地需要腳本。** | 不要單靠 PotentialHireling 來招募。兩個有效的修正，皆已出貨：**(a) It.27 完成（遊戲內已確認）**——免費跟隨 + 一個 Papyrus 啟動片段 `SetRelationshipRank(player,3)`（該主題的條件是關係+跟隨者聲音，**而非** GetIsID；`examples/follower_hireable_spec.json`）。**(b) It.28 完成**——我們**自己的**付費招募主題搭配 OnEnd 結果片段（RemoveItem Gold001×500 + `AddToFaction CurrentFollowerFaction 0x05C84E` + `SetPlayerTeammate(true)`；`examples/follower_paid_spec.json` + `MFHirePaidRecruit.psc`）。關鍵：加入跟隨者系統 = CurrentFollowerFaction + SetPlayerTeammate；**通用**原版跟隨/等待/解散對話（`0x05C80C` 的解散 INFO[17]）只以該派系 + 跟隨者聲音 + PotentialHireling==0 為條件——**無 GetIsID**——因此對沒有 DialogueFollower 任務整合的自訂 NPC 也能運作。請永遠先探查：`infodiag <esp> <topicFormId> [substr]` 倒出任何主題的完整 CTDA 堆疊（現在也含其 OnEnd VMAD 片段）。**It.30/It.32 更新：** 將她加入 `CurrentFollowerFaction` 會讓**通用**原版*解散*臺詞出現，但無法釋放她（該臺詞由 DialogueFollower 任務驅動，它只解散自己 `ForceRefTo` 進其別名的跟隨者）——所以 (b) 還必須自行撰寫自己的解散（自我管理）。**更乾淨、現為偏好的付費路徑是 (c)：** 從招募片段呼叫 `DialogueFollowerScript.SetFollower(akSpeaker)`（`examples/follower_vanilla_spec.json`）——原版接著管理交易/等待/解散，且 AFT/EFF/NFF 都能整合；將該臺詞的條件設為 `GetGlobalValue PlayerFollowerCount(0x0BCC98)==0`。自訂 CombatStyle + 對話在跟隨者狀態下仍存活；sandbox 套件只在實際跟隨時讓位 |
| 啟用含有 `relationships[]` 項目的模組時，**主選單崩潰** | RELA 的 `parent`/`child` 必須指向 **NPC_ 基礎記錄**；玩家的是 `Skyrim.esm:0x000014`。`0x000007` 是 **PlayerRef**（放置的 ACHR）——指向 ACHR 的 RELA 是引擎在載入時拒絕的類型不符 | 使用 `child: "Skyrim.esm:0x000014"`。（原本 `RelationshipSpec.Child` 的預設值是錯的——透過與正常模組逐位元組比對找出並修正。） |
| 啟用含有自訂 `dialogue[]` 的模組時，**主選單崩潰** | 產生的 `DialogTopic` 留有 **SNAM（子類型名稱）= null**（`0x00000000`）。每個原版 `Custom` 主題都帶有 SNAM=`'CUST'`；空的子類型在引擎於載入時建立對話主題索引時崩潰 | 在 `Subtype = Custom` 的同時設定 `topic.SubtypeName = new RecordType("CUST")`。已在 `Generator.Build.cs` 修正；以函式庫手工組合主題時，兩者都要設。用原版探查確認：每個 Custom DIAL 都有 SNAM=`'CUST'` |
| 自訂對話不會崩潰，但**主題從未出現**（**遊戲內已確認修正 It.23，2026-05-30**） | 一堆缺漏的環節，透過與正常運作的原版主題（MS11）逐原始子記錄比對找出。**決定性**的一個：每個玩家 **INFO 都缺少 `ENAM`（資訊旗標）+ `CNAM`（恩惠等級）**——當 `Flags`/`FavorLevel` 未設定時 Mutagen 會省略它們，而沒有 `ENAM` 的 INFO 被視為**無效**，因此唯一 INFO 無效的主題會從選單中靜默移除。另外還需要：每個任務一個 **DialogView（DLVW）**（將分支綁定到任務）以及一個 **Hello** info（使 NPC 完全可對話） | 對每個產生的 INFO 設定 `Flags = new DialogResponseFlags()`（→ENAM）和 `FavorLevel = FavorLevel.None`（→CNAM）。再加上每個任務一個 **DLVW**（`Quest` + 玩家 `Branches` + `ENAM`=4×0/`DNAM`=[1]）和每個說話者一個 **Hello**（`Misc`/`Hello`/`SNAM='HELO'`，無分支，`GetIsID(speaker)`）。全在 `Generator.Build.cs`。用原始子記錄比對驗證：正常運作的原版玩家 INFO 為 `ENAM CNAM TRDT NAM1 NAM2 NAM3 … CTDA` |
| 多個自訂主題時，單獨一個可運作，但 2 個以上時 NPC 又變沉默（**遊戲內 It.25**） | 所有玩家主題共享**相同的 `Priority`（50）**。原版從不讓兩個同時有效的頂層主題共用優先級。**注意：** 此修正恰逢一次全新遊戲測試，因此可能與下方的存檔/載入問題混淆——無論如何仍保留作為良好實務（它符合原版且無害） | 給每個主題**不同的優先級**。Build 分配遞減序列（90、89、88…） |
| **自訂對話永遠不出現，除非在任務開始後 LOAD 過遊戲**——從主選單 `coc` 或中途 `startquest` 即使插件完美、任務執行中，NPC 仍沉默（整個 It.23–26 對話傳奇的根本原因；**遊戲內已確認 2026-05-30**） | Skyrim 在**遊戲載入時**註冊任務的玩家對話，而非任務開始時。全新遊戲會執行該載入步驟（所以對話有效）；但透過從主選單 `coc` 進入世界，或中途 `startquest`，從不重新註冊對話 → 主題/Hello 靜默地永不附加到 NPC 上。這偽裝成十幾種不同的「結構性」錯誤，因為插件自始至終都沒問題 | **測試方式：** 任務執行後，**`save` 再 `load`** 該存檔（強制對話重新註冊）——或乾脆開始一個真正的新遊戲，讓它完成初始化後再 `coc`。**永遠不要**信賴主選單 `coc` 或中途 `startquest` 來顯示對話。這是存檔/執行期規則。**對於使用既有存檔的真實使用者，修正方式是一個 `.seq` 檔案——見下一列。** |

## 場景、世界空間、光照

| 症狀 | 根本原因 | 修正方式 |
|---|---|---|
| 無頭建置在複製原版記錄時拋出「Could not determine plugin listings path」 | 複製本地化的 `TranslatedString`（Name/Description/BookText）觸發需要 plugins.txt/讀取順序的全字串來源解析——在 Linux 無頭環境下缺少 | 向 `DeepCopyIn` 傳入 `TranslationMask { Name=false, … }`（反正那些你都會覆寫）。同樣的地雷會打到場景上的 `GetOrAddAsOverride` 以及 `find` 的 Name 解析 |
| 外部放置後整個世界被淹沒 / 「全部在水下」 | Cell/Worldspace 覆寫**不會**從主記錄繼承省略的資料——引擎會給它們預設值。捨棄 `LandDefaults` 把 `DefaultWaterHeight` 從 Tamriel 真正的 -14000 重設為 0 | 手動複製環境子記錄（`CopyWorldspaceEnv` / `CopyCellEnv`），只跳過本地化的 Name 和巨大的子結構。（cell 自身的 `WaterHeight=FLT_MAX` 只是「使用世界空間預設值」的哨符——是煙霧彈） |
| 世界空間覆寫後存檔 / HUD 顯示「未知地點」 | 最小化覆寫清空了本地化的世界空間 Name（無頭環境無法讀取） | 重新陳述一個普通 Name（Tamriel `0x3C` 用 `"Skyrim"`）；其他世界空間需要未來的規格欄位 |
| 原版內部場景覆寫靜默地被忽略（放置的物件不出現、光照無變化） | 內部場景依 **FormID** 分組到 block/sub-block GRUP 中；在錯誤 GRUP 中的覆寫永遠不會與主記錄匹配 | 從場景 FormID 計算 GRUP：**block = id % 10, sub = (id/10) % 10**（十進位，24 位元 ID）。見 [engine-internals](engine-internals.html#interior-cell-grup-formula) |
| 規格中的新內部場景在 `coc` 時渲染漆黑 / 玩家掉入虛空 | 全新場景沒有光照/LightingTemplate 且沒有地板幾何體 | 給 `cells[].template` 一個原版內部 ref（透過 `CopyCellEnv` 取得光照）；加入放置的靜態地板格（例如 `WRIntFloorSTMid01Large 0x1044AA`） |
| 放置在**無地板**的新場景中的 NPC 下游行為異常——例如商人的交易選單從不開啟（**遊戲內已確認 2026-05-31**） | NPC 掉入虛空處於**持續墜落狀態**，因此永遠不會安定進入待機/sandbox 的「值勤」狀態——而以安定為條件的條件函式（例如商人的 `GetOffersServicesNow`）保持為 0。記錄可以完美無缺；NPC 就是永遠到不了滿足它們的狀態 | 在新場景中任何放置的 NPC 下方永遠**鋪設地板**（`WRIntFloorSTMid01Large 0x1044AA` 格）**並**給它一個值勤套件（櫃檯 NPC 用 `Sandbox 0x01C254` NearSelf）使它原地站立。商人案例已確認：有地板 + sandbox + `VendorLocation`=cell，交易選單即可開啟 |
| 放置的光源幾乎照不到任何東西（房間感覺無光/平板） | 光源基礎是 `PortalStrict`（例如 `DefaultSunlightHalfOmni01 0x0172C4`）——只照亮房間入口內部，而開放場景沒有房間標記 | 使用非 PortalStrict 的全向陰影光源（`WRShadowOmni 0x0C82AE`，半徑 512）作為主光 + 非陰影補光（`WRInteriorLightBrite01 0x06ED46`） |
| `coc` 生成的玩家落在地板內/下方一點 | 沒有 COC 標記的 `coc` 在場景原點（0,0,0）生成；樞軸不在頂面的地板網格會讓你陷進去 | 用 `tcl` 檢查；微調地板 z 或加一個 COC 標記。將地板磚間距配合實際網格尺寸，否則會出現縫隙 |
| `coc <interior>` 然後走出去 → 城門處地形 LOD 損壞 | `coc` 跳過正常載入畫面，外部 LOD 未預先載入 | 快速旅行離開再回來，或直接 `coc <exteriorMarker>` |

## 物品、模型、魔法效果

| 症狀 | 根本原因 | 修正方式 |
|---|---|---|
| 產生的物品掉落時沒有模型（或在裝備/閱讀時崩潰） | 武器/書籍/雜項/藥水沒有 `.nif`——在物品欄沒問題，但在任何場景互動時（武器裝備、書籍 3D 閱讀）**崩潰** | 設定 `template: "<master>:0xFORMID"` 以複製原版記錄的模型（IronSword `0x012EB7`、Book1CheapNordsArise `0x0ED161`、GemRuby `0x063B42`、RestoreHealth06 `0x039BE5`） |
| 產生的**護甲裝備後隱形**（角色看起來赤裸，但 ARMO 在物品欄且屬性/附魔正確）——**已修正 + 遊戲內已確認 2026-06-01**（範本化胸甲穿上時顯示鐵甲網格） | ARMO 的穿戴網格位於其**骨架**（ARMA 附加記錄）上，*而非* ARMO 本身。只有 `BodyTemplate`（armorType + 部位）的規格護甲有**空骨架** → 裝備時什麼都不渲染。與武器不同，這**不會崩潰**——它靜默地什麼都不顯示 | 設定 `template: "<master>:0xFORMID"` 以複製相同部位的原版護甲（ArmorIronCuirass `0x00012E49`）；`DeepCopyIn` 會帶來其骨架（每個身體部位的穿戴網格）+ WorldModel（地面模型）+ BodyTemplate。Build 現在會在護甲無 `template` 時**警告**。選擇性的 `model` 只覆寫地面/世界 `.nif`；穿戴網格仍來自範本的骨架，因此 `model` 要與 `template` 搭配使用 |
| 玩家**學會自訂龍吼但無法喊出**——字詞不觸發任何法術，什麼都沒發生（**遊戲內 2026-06-01**：透過 AddShout 學會龍吼，但 Thu'um 毫無作用） | 每個龍吼字詞指向一個 **Voice 類型 SPEL**，而沒有 **`EquipmentType`（EQUP）** 的 SPEL 沒有裝備槽——引擎無法將其裝備到聲音上，所以按下龍吼鍵什麼都沒發生。ModForge 只在規格明確給出時才設 EQUP；Voice 法術（建置時沒給）就變成無槽。原版龍吼字詞法術全部帶有 **EitherHand（`Skyrim.esm:0x00013F44`）**——與手部法術相同的 EQUP | Build 現在在省略 `equipType` 時，對**可施放法術類型（Spell/Voice/Power/LesserPower）預設使用 EitherHand**。只在要覆寫時才設 `equipType`。（同時給 SHOU 一個 `menuDisplayObject`，例如 `Skyrim.esm:0x0A59AC`，使它在龍吼選單中預覽。） |
| 自訂龍吼觸發了投射物/效果，但**沒有 Thu'um 龍吼聲**（沒有「FUS RO DAH」喊聲） | 喊出的聲音是 MGEF 的 **Release 音效**（一個 `VOCShoutFX…` SoundDescriptor）——不是投射物的。沒有 `sounds` 的龍吼 MGEF 會靜默地施放 | 給 MGEF 設定 `sounds: [{ type: "Release", sound: "<master>:0xFORMID" }]`。原版聲音：Unrelenting Force `0x0A0F52/53/54`（A/B/C 充能等級）、Frost Breath `0x07F8E6/07F8E7`、Fire Breath C `0x072915`。要 3 段喊聲，用 3 個 MGEF（每個字詞法術各一），各帶自己的 A/B/C Release 音效 |
| 複製的藥水給予加倍/堆疊的效果 | `DeepCopyIn` 保留了範本自身的效果，然後與規格效果堆疊 | Build 在複製後、接線規格效果前執行 `r.Effects.Clear()`——只要別在你的規格裡重新加入範本的效果即可 |
| 自訂 MGEF 治癒法術施放了但沒有治癒 | 即時效果上的 `Recover` 旗標會在效果「結束」的瞬間（立刻）回滾治癒 | 即時效果（持續時間 0）必須使用 `["NoDuration","NoArea"]` 且**不帶** `Recover`。`Recover` 只對**限時**強化（例如 +50 生命值/60 秒）才正確 |
| 自訂效果消耗誇張的魔力 | 在自動計算下，高 `baseCost` × 效果量級 | 保持 `baseCost` 較低；自動計算公式會將它乘以量級 |
| 啟用含有**入口點天賦**的模組時，**「Loading Files」時崩潰**（表面上像「兩個模組一起崩潰」——它對記憶體佈局敏感，所以單一插件可能靠運氣載入；**遊戲內 2026-05-31 從 CrashLoggerSSE 日誌找出根本原因**，日誌點名 `BGSEntryPointPerkEntry`） | 入口點天賦效果（`PerkEntryPointModifyValue`）被寫成 `PerkConditionTabCount = 0`。該位元組是入口點的**內在條件分頁計數**（attacker/target/weapon 情境），而非你撰寫的條件數量；引擎依它配置每分頁陣列的大小，因此索引 0 上計數為 0 的 `PRKC` 分頁會**溢位陣列 → 垃圾 FormID 查詢 → 存取違規 CTD**。Mutagen 在讀取時忽略該位元組（使用真正的 `Conditions` 列表），所以 dump/往返/連結解析/ESL 標頭全部通過——只有執行期解析器崩潰 | `Build` 從原版表格設定 `PerkConditionTabCount`（`ModAttackDamage`/`ModSpellMagnitude` = 3、`ModArmorRating` = 2、`ModSkillUse` = 1、… 未列出 → 2；永不為 0）。透過掃描 Skyrim.esm 的 PERK 記錄、依 `EntryPoint → PerkConditionTabCount` 分組重新產生。見 [engine-internals](engine-internals.html#perk-entry-points-carry-a-hidden-tab-count-byte) |

## 對話

| 症狀 | 根本原因 | 修正方式 |
|---|---|---|
| 自訂對話記錄有效，但與 NPC 交談時主題**從不出現** | 兩個旗標缺失：宿主**任務未設定 Start Game Enabled**（所以它從不執行 → 其對話從不載入）和/或 **DialogBranch 未設定為 Top-Level**（所以該主題是子分支，而非選單選項） | 任務 `flags |= StartGameEnabled`（+ 一個 `Priority`）；分支 `Flags = TopLevel`。在 ModForge 中：`quests[].startGameEnabled`（預設 true）+ 對話分支上自動設定 |
| 選單台詞標籤錯誤 / 顯示了錯誤的文字 | INFO 的 `Prompt` 被設定了，覆蓋了選單台詞 | 將 INFO 的 `ResponseData` 留為 null（使用你自己的 Responses）且 `Prompt` 留為 null——選單台詞來自 `topic.Name` |
| 自訂對話台詞沒有聲音 / NPC 嘴唇不動 | 沒有錄製的語音（.fuz/.lip）——對產生的對話這是預期行為 | 開啟**一般 + 對話字幕**（設定 ▸ 顯示）——台詞仍會以字幕顯示，選單選項仍可運作；那是有效的遊戲內確認 |

## 遭遇、等級生成與遭遇區

| 症狀 | 根本原因 | 修正方式 |
|---|---|---|
| 當模組使用 `LChar*` FormID（例如 `LCharBanditMeleeAny 0x03DECD`）作為 ACHR 基底放置 Actor 時，**載入時崩潰** | `LChar*` FormID 是 **LVLN 記錄**（等級 NPC 列表）。將原始 LVLN 作為 ACHR 基底放置是類型不符——引擎對其調用 NPC_ 專用的虛表方法 → 載入時存取違規 CTD。**已確認崩潰（It.36, 2026-06-02）** | 改用 `Lvl*` NPC_ 包裝 Actor：`LvlBanditMeleeAny 0x01E79C`、`LvlBanditMissileNordM 0x01B0D5`、`LvlBanditBossNordM 0x01B0E1`。命名規則：**`Lvl…` 前綴 = NPC_（可安全放置）；`LChar…` 前綴 = LVLN（絕對不能直接放置）**。用 `find <Skyrim.esm> Lvl Npc` 查找包裝器 |
| 規格內的 `leveledNpcs` 列表作為放置 `base` 看似正常，但產生崩潰或類型錯誤 | 當列表的 FormID 作為 ACHR 基底發出時，就是 LVLN-as-ACHR 的同一問題 | 在放置條目加上 `"kind": "npc"`——讓 Build 發出 NPC_ 包裝記錄，而非直接放置 LVLN |
| `coc` 進入新場景後，生成的 Actor 站在原地，從不移動或巡邏 | 新的規格內內部場景**沒有導航網格**——路徑/戰鬥 AI 需要導航網格 | 沒有導航網格的 Actor 仍會正常生成和待機（他們會貼齊地板並 sandbox）。需要巡邏/追蹤時，在 Creation Kit 中為場景建立導航網格（需執行 **Finalize Navmesh** 步驟）。永遠不要從產生器發出 NAVM/NAVI——不完整的 NAVI 會在載入時 CTD（見場景章節的 NAVM 列） |
| 遭遇區的 `minLevel`/`maxLevel` 似乎不影響生成的 Actor | 遭遇區記錄存在，但場景的 `encounterZone` 欄位未指向它 | 連結場景：`cells[].encounterZone: "MF_MyZone"`。個別生成點可用 `placements[].encounterZone` 覆蓋。用 `eczndiag <plugin> <0xFORMID>` 驗證 |
| `maxLevel 0` 強制所有生成點的等級為 0 | `0` 看起來像「低端無上限」，但對 `maxLevel` 來說它是**無上限哨符**（永遠跟隨玩家縮放）。僅當 `maxLevel > 0` 時，Validate 才拒絕 `minLevel > maxLevel` | 這是正確的原版行為（`HelgenZone` 是最低 6 / 最高 0）。對開放式地下城有意使用 |

## 天氣與氣候

| 症狀 | 根本原因 | 修正方式 |
|---|---|---|
| 無法在遊戲內用 `sw <formid>` 測試生成的天氣 | **ESL 旗標**的外掛使用 `FE<slot>xxx` 執行期 FormID；在遊戲內查找輕型外掛的槽位索引沒有簡便方法 | **`build` 在成功建置後會印出每個 WTHR 的精確 `sw` 指令**——直接從那裡複製。若需手動查找：停用 ESL 旗標（`esl: false`），FormID 就會變成可預測的 `<XX>000800`，其中 `XX` 是 MO2 右側面板顯示的讀取順序槽位 |
| 生成的天氣記錄看起來正確，但裝備模組後**遊戲內天空沒有變化** | 發出 WTHR（+ 選擇性 CLMT）**不會**自動將其指派到任何世界空間或地區——天空來自 `WRLD` 的 Climate 欄位或 `REGN` 天氣資料記錄，這兩者都不在這裡撰寫 | 用主控台測試：`sw <XX>000800`（來自建置輸出）強制切換天氣。若要永久指派，在 CK 中將原版或自訂世界空間的 Climate 指向你的 CLMT，或撰寫 REGN 天氣資料條目。這是設計決策——世界空間/地區撰寫超出產生器的範疇 |
| 氣候引用了天氣，但天氣從不出現 | `weathers[].chance` 值是**相對權重**，在內部求和，不是百分比 | 值是比例：`[{chance:75},{chance:25}]` → 75% / 25%。任何正非零權重均有效。Validate 會標示機率為零的條目（永不觸發） |
| 設定了 `precipitation: "..."` SPGD 參照，但沒有雨出現 | `Rainy`/`Snow` 天氣旗標驅動粒子系統；即使有有效的 SPGD，缺少旗標也會讓降水靜默 | 在 `precipitation` 參照旁加上 `"flags": ["Rainy"]`（或 `"Snow"`）。用 `weatherdiag <Skyrim.esm> <a-rainy-WTHR>` 找原版降雨 SPGD（例如 `SkyrimStormRain 0x10780F`） |
