# SPEC Part 3/3 — 配方、天氣、套件、工作流程

## recipes（合成 / COBJ）
讓物品可以在工作台合成、改良或熔煉。recipe 的 `kind` 決定類型（預設為 `craft`）以及**預設工作台**；`workbench` 是一個**具名選擇器**（`forge` / `sharpeningWheel`（即 `grindstone`）/ `armorTable`（即 `workbench`）/ `smelter` / `tanningRack` / `skyforge`）——或是一個原始的 `<master>:0xID` 關鍵字參考，會覆蓋 kind 的預設值。省略 `workbench` 則使用 kind 的預設值。

```jsonc
{ "editorId": "MF_ForgedBladeRecipe",
  "kind": "craft",                      // craft | temper | smelt | breakdown   (預設 craft)
  "createdObject": "MF_ForgedBlade",    // 一個參考 — 通常是規格內的武器/護甲
  "count": 1,
  "workbench": "forge",                 // 具名選擇器或關鍵字參考；省略 -> kind 預設值
  "components": [                        // 合成時消耗（參考 + 數量）
    { "item": "Skyrim.esm:0x05ACE5", "count": 2 },   // SteelIngot
    { "item": "Skyrim.esm:0x0800E4", "count": 1 } ], // LeatherStrips
  "conditions": [                        // 以技能/物品/專長設置條件（共用 CTDA）— 可選
    { "function": "HasPerk", "param": "Skyrim.esm:0x0CB40D", "comparison": "==", "value": 1 } ] }
```

**`kind` 預設值** — `craft` → 鍛造爐，`temper` → 磨刀石，`smelt`/`breakdown` → 熔爐。

**`kind: "temper"`** — 在磨刀石（武器）/ 盔甲工作台（護甲）處改良現有武器/護甲。`createdObject` 就是被改良的物品；組件為改良材料。仿照原版，在鍛造 `HasPerk` 之前加上附魔物品防護條件 `TemperIsEnchanted`（`or: true`）：
```jsonc
{ "editorId": "MF_ForgedBladeTemper", "kind": "temper",
  "createdObject": "MF_ForgedBlade", "workbench": "sharpeningWheel",
  "components": [ { "item": "Skyrim.esm:0x05ACE5", "count": 1 } ],
  "conditions": [
    { "function": "TemperIsEnchanted", "comparison": "!=", "value": 1, "or": true },
    { "function": "HasPerk", "param": "Skyrim.esm:0x0CB40D", "comparison": "==", "value": 1 } ] }
```

**`kind: "smelt"` / `"breakdown"`** — 礦石 → 金屬錠，或在熔爐將物品分解為材料（`createdObject` = 產出的金屬錠，組件 = 消耗的礦石/物品）。

**`conditions`** — 每條件均為共用 CTDA。`function` ∈ `HasPerk` | `GetItemCount` | `GetGlobalValue`（各需要一個 `param` 參考）| `TemperIsEnchanted`（無參數）。使用 `find Skyrim.esm <name> Perk` 查找專長 FormID；`cobjdiag <esp> <0xID>` 可輸出任何 recipe 的完整結構。

常用工作台關鍵字 FormID（從 Skyrim.esm 探取）：`0x088105` 鍛造爐，`0x0ADB78` 盔甲工作台，`0x088108` 磨刀石，`0x0A5CCE` 熔爐，`0x07866A` 製革架，`0x0F46CE` Skyforge。

## perks（PERK）
專長是一種被動能力或數值/戰鬥修正值——技能樹、種族能力及任務獎勵加成的基礎積木。支援兩種效果類型：

```jsonc
{ "editorId": "MF_IronHidePerk", "name": "Iron Hide", "numRanks": 1,
  "effects": [
    // (a) ABILITY — 賦予一個 SPEL。
    { "kind": "ability", "spell": "MF_IronHideAbility" } ] }

{ "editorId": "MF_DeadlyStrikesPerk", "name": "Deadly Strikes", "numRanks": 1,
  "conditions": [
    { "function": "GetBaseActorValue", "actorValue": "OneHanded",
      "comparison": "GreaterThanOrEqualTo", "value": 30 } ],
  "effects": [
    // (b) ENTRY-POINT — 對具名 EntryPoint 的數值修正。
    { "kind": "entryPoint",
      "entryPoint": "ModAttackDamage",
      "function": "Multiply",
      "value": 1.2,
      "conditions": [
        { "function": "WornHasKeyword", "param": "Skyrim.esm:0x01E711",  // WeapTypeSword
          "comparison": "EqualTo", "value": 1 } ] } ] }
```

- **`entryPoint`** 是 Skyrim 的 `EntryType` 值之一 — `ModAttackDamage`、`ModSpellMagnitude`、`CalculateMyCriticalHitChance`、`ModArmorRating`、`GetMaxCarryWeight`… 使用 `perkdiag <Skyrim.esm> entrypoints` 查看完整清單，或 `perkdiag <Skyrim.esm> 0x079343`（Armsman20 = ModAttackDamage ×1.4）。
- **附加至 NPC** 可透過 `npcs[].perks: ["MF_IronHidePerk", …]`——角色在遊戲開始時被動獲得專長。**賦予玩家專長需要 Papyrus `AddPerk` 呼叫**（`scripts` + 任務片段）——沒有純記錄的方式在遊戲開始時將專長放置在玩家身上。
- **遊戲內注意事項：** 結構上這些輸出與原版專長完全一致，但入口點修正是否真的改變戰鬥數值只能透過實際啟動 Skyrim 確認。

## 外部資源 — 自訂網格 / 貼圖 / 音效（`model`、`sounds`、`assets`）
```jsonc
"assets": "my_assets",          // 來源目錄；package 將其 Meshes/Textures/Sound/… 複製至模組內
"sounds": [ { "editorId": "MFChimeSD", "files": [ "Sound\\fx\\mymod\\chime.wav" ] } ],
"statics":    [ { "editorId": "MFStone",  "model": "MyMod\\stone.nif" } ],
"furniture":  [ { "editorId": "MFThrone", "name": "Throne", "model": "MyMod\\throne.nif" } ],
"activators": [ { "editorId": "MFBell", "name": "Bell", "model": "MyMod\\bell.nif",
                  "activationSound": "MFChimeSD" } ]
```

- **`model`**（用於 statics/activators/furniture/miscItems/weapons）是以 Data 相對的 `.nif` 路徑，根目錄為 `Meshes\`——因此請**省略 `Meshes\` 前綴**（寫 `MyMod\bell.nif`，而非 `Meshes\MyMod\bell.nif`）。`validate` 會強制執行此規則。

## textureSets（TXST）— 無需新網格的貼圖替換
大量模組只是**替換現有網格的貼圖**而不製作新的 `.nif`。這就是 **TextureSet（TXST）** 記錄：一組貼圖路徑，加上讓消費者將基礎網格上的具名材質指向它的設定。

TXST 最多有八個可選插槽；只需設定你要替換的插槽。每個路徑均**相對於 `Data\Textures\`**——因此請**省略**開頭的 `Textures\`：

```jsonc
"textureSets": [
  { "editorId": "MF_GildedRubbleTexture",
    "diffuse": "ModForge\\rubble\\gilded_rubble_d.dds",   // 插槽 0 — 顏色/反照率 (_d)
    "normal":  "ModForge\\rubble\\gilded_rubble_n.dds",   // 插槽 1 — 法線 + 光澤 (_n)
    "flags": [ "NoSpecularMap" ] }
]
```

透過 `statics` 或 `activators` 記錄上的 `alternateTextures` 連接至消費者。每個條目覆蓋基礎 `.nif` 內一個**具名材質/子網格**：

```jsonc
"statics": [
  { "editorId": "MF_GildedRubble",
    "model": "Dungeons\\Nordic\\Rubble\\NorRubblePiece03.nif",   // 一個原版網格，直接重用
    "alternateTextures": [
      { "name": "NorRubblePiece03:0",        // 必須匹配 .nif 中的材質/3D 名稱（CK「AltTex」對話框）
        "index": 0,                           // 3D 子網格索引
        "textureSet": "MF_GildedRubbleTexture" } ] }
]
```

## packages — AI 套件（NPC 的行為）
`packages` 條目是一個 AI 套件。Skyrim 的 PACK 記錄採用**模板驅動**方式：你透過 `template` 參考一個原版「程序模板」表單，由該模板定義資料輸入結構（插槽索引及類型）。我們的套件為模板所定義的插槽填入輸入值。

ModForge 目前實作七個模板——**Sandbox**（`Skyrim.esm:0x01C254`）、**Sleep**（`Skyrim.esm:0x019717`）、**Travel**（`Skyrim.esm:0x016FAA`）、**UseMagic**（`Skyrim.esm:0x0504F5`）、**Patrol**（`Skyrim.esm:0x017723`）、**Follow**（`Skyrim.esm:0x019B2C`）及 **Escort**（`Skyrim.esm:0x023B73`）。

**Sandbox 指定參考 vs Travel：** Sandbox 的 `location` 參考讓 NPC 在該參考**附近**徘徊/進食/就坐。Travel 的 `place` 參考讓 NPC 真正**走向**該參考並停在其 `radius` 範圍內。常見組合：Travel 套件 + Sandbox 套件（Travel 在前）——Travel 執行直到 NPC 抵達，然後 Sandbox 接管。

```jsonc
{ "editorId": "MF_HangAtSpotPackage",
  "template": "Skyrim.esm:0x01C254",        // Sandbox 程序模板
  "preferredSpeed": "Walk",
  "interruptFlags": [
    "HellosToPlayer", "RandomConversations", "ObserveCombatBehavior",
    "GreetCorpseBehavior", "ReactionToPlayerActions", "FriendlyFireComments",
    "AggroRadiusBehavior", "AllowIdleChatter", "WorldInteractions" ],
  "schedule": { "hour": -1, "minute": -1, "durationInMinutes": 0, "dayOfWeek": "Any" },
  "sandbox": {
    "radius": 1024,
    "location": "",
    "allowEating": true,  "allowSleeping": false,  "allowConversation": true,
    "allowIdleMarkers": true, "allowSitting": true, "allowWandering": true,
    "allowSpecialFurniture": true, "energy": 50.0 } }
```

**It.18 注意事項（UseMagic 特有的實戰血淚）：**
1. **Spell 插槽必須是 `PackageTargetObjectID`，而非 `PackageTargetObjectType`。** 所有 46 個原版 UseMagic 套件均用 FormLink 覆寫。
2. **Target 插槽必須設定**——自我施法用 `PackageTargetSelf`。
3. **`numToCastMax` 是整個套件生命周期的施法總次數**。若要持續施法，必須同時設定高上限值**及**非零的 `schedule.durationInMinutes`（例如 1440 = 24 小時）。
4. **戰鬥會中斷 UseMagic。** 若要強制施法持續，加入 `flags: [ "IgnoreCombat" ]`。

**中斷旗標（Package.InterruptFlag）：** `HellosToPlayer`、`RandomConversations`、`ObserveCombatBehavior`、`GreetCorpseBehavior`、`ReactionToPlayerActions`、`FriendlyFireComments`、`AggroRadiusBehavior`、`AllowIdleChatter`、`WorldInteractions`。**這些旗標決定了一個 NPC 是沉默的石像還是栩栩如生的角色。**

## 天氣與氣候 — 自訂天空（WTHR）+ 天氣循環（CLMT）

```jsonc
"weathers": [{
  "editorId": "MF_EerieFog",
  "flags": ["Cloudy", "Rainy"],
  "skyUpperColor": {
    "day":   { "r": 46, "g": 92, "b": 58 },
    "night": { "r": 8,  "g": 20, "b": 14 }
  },
  "fogNearColor": { "day": { "r": 60, "g": 120, "b": 70 } },
  "sunlightColor": { "day": { "r": 120, "g": 170, "b": 110 } },
  "clouds": [{ "index": 0, "texture": "Sky\\SkyrimCloudsUpper04.dds",
               "xSpeed": 0.012, "ySpeed": -0.006, "alphaDay": 1.0, "alphaNight": 0.8 }],
  "precipitation": "Skyrim.esm:0x10780F",
  "windSpeed": 0.35, "windDirection": 210,
  "fogDayNear": 256, "fogDayFar": 9000
}],
"climates": [{
  "editorId": "MF_EerieClimate",
  "weathers": [ { "weather": "MF_EerieFog", "chance": 75 },
                { "weather": "MF_PlainClear", "chance": 25 } ],
  "sunriseBegin": "06:00", "sunriseEnd": "09:30",
  "sunsetBegin": "17:00",  "sunsetEnd": "20:00",
  "moons": ["Masser", "Secunda"], "volatility": 40
}]
```

- **最簡結構即有效。** 只含 `editorId` 的天氣是符合原版規範的晴天天空；氣候只需 `editorId` + 至少一個 `weather`。
- **顏色**為 8 位元 RGB（0–255）。任何省略的時段從 `day` 繼承。
- **風向**以**度**（0–360）編寫；**風速**接受 0–1 分數或 0–100 百分比。
- **`precipitation`** 是指向著色粒子幾何體（`SPGD`）的 *ref*。使用 `weatherdiag <Skyrim.esm> <rainy-WTHR-formid>` 查找原版雨效。

> **指派氣候是獨立步驟。** 輸出 `WTHR`+`CLMT` 本身**不會**改變任何遊戲內天空。原版透過**世界空間**（`WRLD` `Climate` 欄位）或**地區**（`REGN` 天氣資料）套用氣候。**已於遊戲內確認（It.36，2026-06-02）：** 透過控制台 `sw <XX>000800` 強制天氣。`build` 指令在建置成功後會輸出所有 WTHR 記錄的 `sw` 指令。

## 工作流程

```bash
dotnet run --project src/ModForge.Cli -- validate myspec.json          # 先行檢查
dotnet run --project src/ModForge.Cli -- build    myspec.json out.esp   # 僅建置插件
dotnet run --project src/ModForge.Cli -- package  myspec.json OutModDir # esp + 編譯後的腳本 -> MO2 資料夾
```

`package` 輸出 `OutModDir/<pluginName>` + `Scripts/*.pex` + `Scripts/Source/*.psc`。

**自然語言 → 規格：** 向 AI 代理人（Claude Code）描述需求；代理人根據本文件 / `../examples/spec.schema.json`（依 `for_agent.md`）輸出規格，執行 `validate`（自動修正問題），再執行 `build`/`package`。此代理人驅動循環**即是** NL→規格層——工具本身不含 LLM API（原本規劃的 `describe` 指令已取消），因此無需設定任何 API 金鑰或提供商。

## 尚未涵蓋（可在 `ModForge.Core` 的 `Generator.Build` + 規格類別中擴充）
世界放置現已涵蓋新建室內場景、原版室內場景，**以及室外/世界空間場景**（透過 `worldspace` + 世界座標），ModForge 現在也能**建立**新的世界空間（WRLD）+ 地區（REGN）——見 [SPEC Part 2：worldspaces & regions](spec-2.html)（僅限記錄層；地形/LOD/導航網格仍在 CK 端）。其餘缺口為長尾記錄類型/欄位及 CK 端的地形/LOD/導航網格創作——記錄端的模式相同：新增一個規格類別 + 在 `Build` 中新增一個迴圈。

完整可用範例請見 `../examples/sample_spec.json`。
